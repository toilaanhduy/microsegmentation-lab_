version: '3.8'

networks:
  frontend_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true # Chặn hoàn toàn Egress/Ingress ra Internet và các mạng khác

services:
  database:
    image: postgres:15-alpine
    container_name: tier3-database
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: securepass
      POSTGRES_DB: appdb
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tier2-backend
    environment:
      DATABASE_URL: "postgresql://dbuser:securepass@database:5432/appdb"
    networks:
      - frontend_net
      - data_net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:1.25-alpine
    container_name: tier1-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy