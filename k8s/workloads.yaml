apiVersion: v1
kind: Namespace
metadata:
  name: micro-app
  labels:
    zone: production
    environment: enterprise-sec
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: micro-app
type: Opaque
stringData:
  POSTGRES_USER: "dbuser"
  POSTGRES_PASSWORD: "securepass"
  POSTGRES_DB: "appdb"
  DATABASE_URL: "postgresql://dbuser:securepass@database:5432/appdb"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: micro-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: micro-app
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        index index.html index.htm;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        location /items {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="vi" class="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Zero-Trust Enterprise Microsegmentation Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen">
        <!-- Top Security Navbar -->
        <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 px-6 py-4 shadow-xl">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-indigo-600 bg-opacity-20 border border-indigo-500 rounded-xl text-indigo-400">
                        <i class="fa-solid fa-shield-halved text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-white">Zero-Trust Microsegmentation Lab</h1>
                        <p class="text-xs text-gray-400">Kubernetes Security Operations Center (SOC)</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="hidden md:flex items-center space-x-2 bg-emerald-950 border border-emerald-800 px-3 py-1.5 rounded-full text-xs">
                        <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>
                        <span class="font-semibold text-emerald-300">NetworkPolicies Active</span>
                    </div>
                    <div class="flex items-center space-x-2 bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-full text-xs font-mono text-gray-300">
                        <i class="fa-solid fa-server text-indigo-400"></i> Namespace: micro-app
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Container -->
        <main class="max-w-7xl mx-auto px-6 py-8">
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Tổng sản phẩm</p>
                            <h3 id="statTotal" class="text-3xl font-extrabold text-white mt-2">0</h3>
                        </div>
                        <div class="p-3 bg-indigo-900 bg-opacity-40 text-indigo-400 rounded-xl"><i class="fa-solid fa-box-archive text-lg"></i></div>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-emerald-400 font-medium">
                        <i class="fa-solid fa-arrow-trend-up mr-1.5"></i> Đồng bộ real-time từ DB
                    </div>
                </div>

                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Tổng giá trị tồn kho</p>
                            <h3 id="statValue" class="text-3xl font-extrabold text-emerald-400 mt-2">0 đ</h3>
                        </div>
                        <div class="p-3 bg-emerald-900 bg-opacity-40 text-emerald-400 rounded-xl"><i class="fa-solid fa-wallet text-lg"></i></div>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-gray-400 font-medium">
                        <i class="fa-solid fa-shield-check text-emerald-400 mr-1.5"></i> Protected by PostgreSQL PVC
                    </div>
                </div>

                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Kiến trúc hệ thống</p>
                            <h3 class="text-xl font-bold text-blue-400 mt-2">3-Tier High-Avail</h3>
                        </div>
                        <div class="p-3 bg-blue-900 bg-opacity-40 text-blue-400 rounded-xl"><i class="fa-solid fa-network-wired text-lg"></i></div>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-blue-300 font-medium">
                        <i class="fa-solid fa-circle-check mr-1.5"></i> InitContainers Ready
                    </div>
                </div>

                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Mô hình phân đoạn</p>
                            <h3 class="text-xl font-bold text-purple-400 mt-2">Default-Deny</h3>
                        </div>
                        <div class="p-3 bg-purple-900 bg-opacity-40 text-purple-400 rounded-xl"><i class="fa-solid fa-lock text-lg"></i></div>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-purple-300 font-medium">
                        <i class="fa-solid fa-shield-halved mr-1.5"></i> Zero-Trust Enforced
                    </div>
                </div>
            </div>

            <!-- Content Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left: Form Action -->
                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-lg h-fit">
                    <h2 class="text-base font-bold text-white mb-5 flex items-center gap-2.5 border-b border-gray-800 pb-4">
                        <div class="p-2 bg-indigo-600 rounded-lg text-white text-sm"><i class="fa-solid fa-plus"></i></div> 
                        Thêm Sản Phẩm Mới
                    </h2>
                    <form id="productForm" onsubmit="addProduct(event)" class="space-y-4">
                        <div>
                            <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2">Tên sản phẩm</label>
                            <input type="text" id="name" required class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-indigo-500 text-sm transition" placeholder="Nhập tên sản phẩm...">
                        </div>
                        <div>
                            <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2">Giá tiền (VNĐ)</label>
                            <input type="number" step="any" id="price" required class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-indigo-500 text-sm transition" placeholder="Nhập giá tiền...">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg flex items-center justify-center space-x-2 text-sm">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span>Lưu dữ liệu qua API</span>
                        </button>
                    </form>
                    <div id="statusMsg" class="mt-4 text-sm text-center font-semibold"></div>
                </div>

                <!-- Right: Data Table & Live Stream -->
                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-lg lg:col-span-2">
                    <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                        <h2 class="text-base font-bold text-white flex items-center gap-2.5">
                            <div class="p-2 bg-emerald-600 rounded-lg text-white text-sm"><i class="fa-solid fa-table"></i></div>
                            Danh Sách Sản Phẩm (PostgreSQL Cluster)
                        </h2>
                        <button onclick="loadProducts()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-2 border border-gray-700">
                            <i class="fa-solid fa-rotate"></i>
                            <span>Làm mới</span>
                        </button>
                    </div>
                    <div class="overflow-x-auto rounded-xl border border-gray-800">
                        <table class="min-w-full bg-gray-950 text-left text-sm">
                            <thead class="bg-gray-900 text-gray-400 text-xs uppercase font-semibold border-b border-gray-800">
                                <tr>
                                    <th class="py-3.5 px-4">ID</th>
                                    <th class="py-3.5 px-4">Tên sản phẩm</th>
                                    <th class="py-3.5 px-4">Giá (VNĐ)</th>
                                    <th class="py-3.5 px-4 text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody" class="divide-y divide-gray-900 text-gray-300">
                                <tr>
                                    <td colspan="4" class="text-center py-8 text-gray-500">Đang đồng bộ dữ liệu bảo mật từ database...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <script>
            async function loadProducts() {
                try {
                    const response = await fetch('/items');
                    const items = await response.json();
                    const tbody = document.getElementById('productTableBody');
                    tbody.innerHTML = '';
                    document.getElementById('statTotal').innerText = items.length;
                    const totalVal = items.reduce((sum, item) => sum + Number(item.price), 0);
                    document.getElementById('statValue').innerText = totalVal.toLocaleString() + ' đ';
                    if (items.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">Chưa có bản ghi dữ liệu nào trong bảng.</td></tr>';
                        return;
                    }
                    items.forEach(item => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-900 transition">
                                <td class="py-4 px-4 text-gray-400 font-mono">#${item.id}</td>
                                <td class="py-4 px-4 font-semibold text-white">${item.name}</td>
                                <td class="py-4 px-4 text-emerald-400 font-bold">${Number(item.price).toLocaleString()} đ</td>
                                <td class="py-4 px-4 text-center">
                                    <button onclick="deleteProduct(${item.id})" class="text-red-400 hover:text-red-300 bg-red-950 hover:bg-red-900 border border-red-800 p-2 rounded-xl transition shadow-sm" title="Xóa bản ghi">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } catch (error) {
                    console.error('Lỗi tải dữ liệu:', error);
                    document.getElementById('productTableBody').innerHTML = '<tr><td colspan="4" class="text-center py-8 text-red-400">Không thể kết nối đến Backend API qua NetworkPolicy!</td></tr>';
                }
            }
            async function addProduct(event) {
                event.preventDefault();
                const name = document.getElementById('name').value;
                const price = document.getElementById('price').value;
                const statusMsg = document.getElementById('statusMsg');
                try {
                    const response = await fetch('/items', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name, price: parseFloat(price) })
                    });
                    if (response.ok) {
                        statusMsg.className = "mt-4 text-sm text-center font-semibold text-emerald-400";
                        statusMsg.innerText = "✨ Thêm sản phẩm thành công qua mạng phân đoạn!";
                        document.getElementById('productForm').reset();
                        loadProducts();
                        setTimeout(() => { statusMsg.innerText = ""; }, 3000);
                    } else {
                        throw new Error('Lỗi từ server');
                    }
                } catch (error) {
                    statusMsg.className = "mt-4 text-sm text-center font-semibold text-red-400";
                    statusMsg.innerText = "❌ Thêm thất bại! Kiểm tra lại chính sách mạng.";
                }
            }
            async function deleteProduct(id) {
                if (!confirm(`Bạn có chắc muốn xóa bản ghi #${id}?`)) return;
                try {
                    const response = await fetch(`/items/${id}`, { method: 'DELETE' });
                    if (response.ok) { loadProducts(); } else { alert('Xóa thất bại!'); }
                } catch (error) { console.error('Lỗi xóa:', error); alert('Lỗi kết nối hệ thống!'); }
            }
            loadProducts();
        </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: micro-app
  labels:
    app: database
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
        tier: data
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_DB
        ports:
        - containerPort: 5432
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: micro-app
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: database
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: micro-app
  labels:
    app: backend
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      initContainers:
      - name: wait-for-database
        image: busybox:1.36
        command: ['sh', '-c', 'echo "Đang kiểm tra kết nối Database..."; until nc -z -w 2 database 5432; do sleep 2; done; echo "Database đã sẵn sàng mở cổng kết nối!"']
      containers:
      - name: fastapi
        image: microsegmentation-lab-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DATABASE_URL
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: micro-app
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: backend
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: micro-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: micro-app
  labels:
    app: frontend
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "20m"
            memory: "32Mi"
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
        - name: nginx-conf-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: html-volume
        configMap:
          name: frontend-config
          items:
          - key: index.html
            path: index.html
      - name: nginx-conf-volume
        configMap:
          name: frontend-config
          items:
          - key: nginx.conf
            path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: micro-app
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: frontend